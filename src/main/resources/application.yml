spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/education_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 часа в миллисекундах
  storage:
    upload-dir: "./uploads"
    allowed-mime-types: image/jpeg,image/png,image/gif,application/pdf,video/mp4,video/webm
    max-file-size-bytes: 52428800 # 50 MB в байтах

logging:
  level:
    org.springframework.security: DEBUG
