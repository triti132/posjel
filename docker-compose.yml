services:
  postgres:
    image: postgres:16-alpine
    container_name: education_postgres
    environment:
      POSTGRES_DB: education_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"   # <--- ИЗМЕНЕНО ЗДЕСЬ
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: